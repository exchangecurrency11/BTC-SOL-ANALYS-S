
name: Test Cloudflare Data Bridge

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download BTC SOL market data
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --max-time 60 \
            "https://btc-sol-futures-test.exchange-currency-1111.workers.dev/" \
            -o market_data.json

      - name: Validate market data
        run: |
          python3 - <<'PY'
          import json

          with open("market_data.json") as f:
              data = json.load(f)

          assert data.get("ok") is True, "API reported failure"

          results = data.get("results", [])
          assert len(results) == 6, "Expected 6 data groups"
          assert all(r.get("status") == "READY" for r in results), \
              "Some data groups are not ready"

          for r in results:
              print(
                  r["symbol"],
                  r["interval"],
                  r["closeTimeUTC"],
                  r["candle"]["close"]
              )

          print("SUCCESS: 6/6 market data groups verified")
          PY

      - name: Save downloaded JSON
        uses: actions/upload-artifact@v4
        with:
          name: btc-sol-market-data
          path: market_data.json
