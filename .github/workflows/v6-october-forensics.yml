name: V6 BTC SOL October Archive and Failure Forensics

on:
  push:
    branches:
      - experiment/early-signals-v1-20261022
    paths:
      - extend_binance_archive_october_v6.py
      - analyze_failure_patterns_v6.py
      - tests/test_october_failure_analysis_v6.py
      - .github/workflows/v6-october-forensics.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-daily-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Run all offline unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Read and SHA256-verify an official completed October Binance Futures daily ZIP
        run: |
          python3 - <<'PY'
          from extend_binance_archive_october_v6 import download_day
          for s in ("BTCUSDT","SOLUSDT"):
              symbol,day,rows,proof=download_day(s,"2026-10-27")
              assert symbol==s and len(rows)==24 and len(proof["sha256"])==64
              print("DAILY SMOKE VERIFIED",s,day,len(rows),proof["sha256"])
          PY

  october-chronological-replay:
    needs: verify-daily-archive
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Download and verify old 24 months Binance USD-M 1H
        run: |
          python3 download_binance_um_history.py --start 2024-10 --end 2026-09 \
            --workers 4 --output-dir binance_2y
      - name: SHA256-verify and append only UTC-complete October 1-29 daily 1H klines
        run: |
          python3 extend_binance_archive_october_v6.py \
            --base-dir binance_2y --first-day 2026-10-01 --last-day 2026-10-29 \
            --workers 4 --output-dir binance_oct29
          python3 - <<'PY'
          import json
          manifest=json.load(open("binance_oct29/extended_manifest.json"))
          assert manifest["additionalDailyZipFilesVerified"]==58
          assert manifest["endExclusiveUTC"]=="2026-10-30T00:00:00+00:00"
          for sym in ("BTCUSDT","SOLUSDT"):
              assert manifest["counts"][sym]=={"1hour":18216,"4hour":4554,"daily":759}
          print("OCTOBER ARCHIVE CONTIGUOUS",manifest["counts"])
          PY
      - name: Rerun unchanged V4 paper-entry rules with October closed candles
        run: |
          python3 backtest_retest_long_v4.py \
            --hour binance_oct29/history_1hour.json \
            --four binance_oct29/history_4hour.json \
            --daily binance_oct29/history_daily.json \
            --as-of 1793318400 --split-utc 2026-04-01T00:00:00+00:00 \
            --output binance_oct29/october_extended_paper.json
      - name: Verify original 24-month historical signals unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41114906506 --repo "${{ github.repository }}" \
            --name binance-usdm-24-month-paper-test --dir baseline
          python3 - <<'PY'
          import json
          older=json.load(open("baseline/long_v4_result.json"))
          newer=json.load(open("binance_oct29/october_extended_paper.json"))
          september_end=1790812800
          for sym in ("BTCUSDT_PERP.A","SOLUSDT_PERP.A"):
              old=older["results"][sym]
              new=newer["results"][sym]
              old_alerts=old["alerts"]
              new_alerts=[a for a in new["alerts"] if a["knownUTC"]<=september_end]
              assert old_alerts==new_alerts,(sym,"CHANGED OLD ALERTS",len(old_alerts),len(new_alerts))
              old_trades=old["trades"]
              new_trades=[t for t in new["trades"] if t["entryOpenUTC"]<september_end]
              assert old_trades==new_trades,(sym,"CHANGED OLD TRADES",len(old_trades),len(new_trades))
              print("NO HISTORICAL DRIFT",sym,len(old_alerts),len(old_trades))
          PY
      - name: Classify false-entry outcomes, RSI extremes, volume and retest lag
        run: |
          python3 analyze_failure_patterns_v6.py \
            --input binance_oct29/october_extended_paper.json \
            --output binance_oct29/failure_forensics_v6.json
      - name: Publish results and verified source chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-sol-oct29-forensics-v6
          path: |
            binance_oct29/extended_manifest.json
            binance_oct29/october_extended_paper.json
            binance_oct29/failure_forensics_v6.json
          if-no-files-found: warn
          retention-days: 21
      - name: Safety boundary
        run: echo "No live orders, no main branch changes, no push notifications or trading advice."
