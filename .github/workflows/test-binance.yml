
name: Test Binance Futures Data

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Binance perpetual candles
        run: python fetch_data.py

      - name: Save test data
        uses: actions/upload-artifact@v4
        with:
          name: binance-4h-test
          path: data/market_data.json
